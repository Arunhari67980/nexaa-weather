<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="12" y1="18" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="36" y1="8" x2="56" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ambient Sun behind cloud -->
  <circle cx="44" cy="20" r="11" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)" />
  <!-- Main Cloud Shape -->
  <path
    d="M47 48H20C13.373 48 8 42.627 8 36C8 29.856 12.623 24.789 18.635 24.084C20.655 16.592 27.525 11 35.714 11C45.334 11 53.21 18.374 53.95 27.818C57.447 29.351 60 32.846 60 37C60 43.075 55.075 48 49 48H47Z"
    fill="url(#cloudGrad)"
    opacity="0.95"
  />
  <!-- Inner Highlight -->
  <path
    d="M21 27C21 22 26 15 35.5 15C43 15 49 20.5 50 28"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.4"
  />
</svg>
